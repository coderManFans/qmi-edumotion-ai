name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system fonts for video frame rendering
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run tests
        run: pytest
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  async-video-e2e:
    runs-on: ubuntu-latest
  benchmark-video-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare test environment and validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/^TTS_PROVIDER=edge$/TTS_PROVIDER=none/' .env
          docker compose -f backend/docker-compose.yml config --quiet
      - name: Build and start Redis, API and Celery Worker with Docker Compose
        run: docker compose -f backend/docker-compose.yml up --build -d
      - name: Submit Chinese math problem and verify async MP4 generation/download
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "http://127.0.0.1:8000"

          def request(path, data=None):
              body = urllib.parse.urlencode(data).encode() if data is not None else None
              headers = {"Content-Type": "application/x-www-form-urlencoded"} if body is not None else {}
              req = urllib.request.Request(base + path, data=body, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, response.headers, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.headers, error.read()
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  return 0, None, str(error).encode()

          for _ in range(90):
              status, _, body = request("/api/v1/health")
              if status == 200:
                  break
              time.sleep(1)
          else:
              raise RuntimeError("Docker Compose API did not become healthy")

          question = "一个长方形长 8 厘米、宽 5 厘米，面积是多少？"
          status, _, body = request("/api/v1/problems/video", {"text": question})
          assert status == 202, body.decode(errors="replace")
          job_id = json.loads(body)["job_id"]

          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              status, _, body = request(f"/api/v1/problems/jobs/{job_id}")
              if status == 0:
                  time.sleep(0.5)
                  continue
              assert status == 200, body.decode(errors="replace")
              job = json.loads(body)
              if job["status"] == "failed":
                  raise RuntimeError(job.get("error") or "Docker Celery task failed")
              if job["status"] == "completed":
                  break
              time.sleep(0.5)
          else:
              raise TimeoutError("Docker Compose video job did not complete within 180 seconds")

          result = job["result"]
          assert result["answer"] == "40平方厘米", result
          assert result["verification_status"] == "verified", result
          assert result["audio_status"] == "disabled", result

          status, headers, video = request(job["video_url"])
          assert status == 200, video[:500]
          assert headers.get_content_type() == "video/mp4"
          assert len(video) > 1000
          host_video = pathlib.Path("data/renders") / f"{job_id}.mp4"
          assert host_video.is_file() and host_video.stat().st_size > 1000
          print(f"Docker Compose job {job_id} completed; MP4 download returned {len(video)} bytes.")
          PY
      - name: Verify all Compose services and worker startup
        run: |
          docker compose -f backend/docker-compose.yml ps
          docker compose -f backend/docker-compose.yml logs --tail=80 worker
          docker compose -f backend/docker-compose.yml ps --format json | python -c '
          import json, sys
          rows = [json.loads(line) for line in sys.stdin if line.strip()]
          states = {row["Service"]: row["State"] for row in rows}
          assert states.get("redis") == "running", states
          assert states.get("api") == "running", states
          assert states.get("worker") == "running", states
          '
          docker compose -f backend/docker-compose.yml logs worker | grep -q "ready."
      - name: Verify FFmpeg audio mux and ffprobe duration inside API container
        run: |
          docker compose -f backend/docker-compose.yml exec -T api python - <<'PY'
          import pathlib
          import subprocess

          from app.render.video_renderer import render_explanation_video
          from app.schemas.problem import ExplanationScene

          audio = pathlib.Path("/tmp/sync-tone.mp3")
          subprocess.run(
              [
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-f", "lavfi", "-i", "sine=frequency=440:duration=1.5",
                  "-q:a", "3", str(audio),
              ],
              check=True,
          )
          scene = ExplanationScene(
              id="sync-scene",
              title="音画同步测试",
              narration="这是一段用于验证音画同步的测试音频。",
              visual="answer",
              visual_text="1 + 1 = 2",
          )
          output = render_explanation_video(
              "sync-check", [scene], audio_path=audio, scene_durations=[1.5]
          )
          streams = subprocess.run(
              [
                  "ffprobe", "-v", "error", "-show_entries", "stream=codec_type",
                  "-of", "csv=p=0", str(output),
              ],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          assert "video" in streams and "audio" in streams, streams
          duration = float(subprocess.run(
              [
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1", str(output),
              ],
              capture_output=True, text=True, check=True,
          ).stdout.strip())
          assert abs(duration - 1.5) <= 0.35, duration
          print(f"MP4 contains audio/video streams; ffprobe duration={duration:.3f}s.")
          PY
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose -f backend/docker-compose.yml logs --tail=150
      - name: Stop Compose stack
        if: always()
        run: docker compose -f backend/docker-compose.yml down -v
      - name: Install FFmpeg and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Generate five narrated benchmark videos
        run: pytest -q tests/test_benchmark_video_e2e.py -s
        working-directory: backend
      - name: Upload benchmark videos, narration and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edumotion-five-topic-video-benchmark
          path: |
            backend/data/renders/benchmark-*.mp4
            backend/data/renders/benchmark-*-narration.txt
            backend/data/benchmark_video_report.json
          if-no-files-found: warn
          retention-days: 14
