name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system fonts for video frame rendering
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run tests
        run: pytest
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  benchmark-video-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Generate five narrated benchmark videos
        run: pytest -q tests/test_benchmark_video_e2e.py -s
        working-directory: backend
      - name: Upload benchmark videos, narration and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edumotion-five-topic-video-benchmark
          path: |
            backend/data/renders/benchmark-*.mp4
            backend/data/renders/benchmark-*-narration.txt
            backend/data/benchmark_video_report.json
          if-no-files-found: warn
          retention-days: 14
